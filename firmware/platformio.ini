; Прошивка ESP32 «Циклон». Открыть папку firmware в VS Code + PlatformIO.
;   Сборка и загрузка:   pio run -e esp32dev -t upload
;   Монитор порта:       pio device monitor   (команды можно набирать руками: $PNG,1)
; Тесты логики на ПК — через Makefile:  make -C test   (нужен g++)

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = send_on_enter
monitor_echo = yes
build_unflags = -std=gnu++11
build_flags = -std=gnu++17 -Wall
